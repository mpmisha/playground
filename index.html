<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#20264f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Playground">
  <title>Playground</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hub">
    <button class="hub-info" id="hub-info" aria-label="About">ℹ︎</button>
    <button class="hub-gear" id="hub-gear" aria-label="Settings">⚙︎</button>

    <ul class="game-grid" id="game-grid" aria-label="Games"></ul>

    <p class="hub-empty" id="hub-empty" hidden>No games yet.</p>
  </main>

  <!-- Global settings, inherited by every game (same-origin localStorage). -->
  <div class="overlay" id="settings-overlay" hidden>
    <div class="scrim" data-dismiss="settings"></div>
    <div class="panel" role="dialog" aria-label="Settings">
      <h2 id="settings-title">Settings</h2>
      <p class="panel-sub" id="settings-sub">Applies to every game</p>

      <div class="row">
        <span class="row-label" id="label-sound">Sound</span>
        <button class="toggle" id="toggle-sound" role="switch"><span class="knob"></span></button>
      </div>

      <div class="row">
        <span class="row-label" id="label-haptics">Vibration</span>
        <button class="toggle" id="toggle-haptics" role="switch"><span class="knob"></span></button>
      </div>

      <div class="row">
        <span class="row-label" id="label-language">Language</span>
        <div class="segmented" id="lang-chooser" role="group" aria-label="Language">
          <button class="seg-btn" id="lang-en" data-lang="en">English</button>
          <button class="seg-btn" id="lang-he" data-lang="he">עברית</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-label" id="label-feedback">Requests &amp; feedback</div>
        <button class="btn tertiary" id="btn-suggest">🎲 Suggest a game</button>
        <button class="btn tertiary" id="btn-feedback">💬 Send feedback</button>
      </div>

      <button class="btn secondary" id="btn-close">Close</button>
    </div>
  </div>

  <!-- About / info: what this is + how to install to the home screen. -->
  <div class="overlay" id="info-overlay" hidden>
    <div class="scrim" data-dismiss="info"></div>
    <div class="panel info-panel" role="dialog" aria-label="About" id="info-dialog">
      <h2 id="info-title">About</h2>
      <div class="info-body">
        <p class="info-intro" id="info-intro"></p>
        <h3 class="info-h" id="info-install-title"></h3>
        <p class="info-sub2" id="info-install-sub"></p>
        <section class="info-device">
          <div class="info-device-title" id="info-ios-title"></div>
          <ol class="info-steps" id="info-ios-steps"></ol>
        </section>
        <section class="info-device">
          <div class="info-device-title" id="info-android-title"></div>
          <ol class="info-steps" id="info-android-steps"></ol>
        </section>
      </div>
      <button class="btn secondary" id="info-close">Close</button>
    </div>
  </div>

  <!-- In-app feedback / game request form → sent to App Insights via telemetry. -->
  <div class="overlay" id="feedback-overlay" hidden>
    <div class="scrim" data-dismiss="feedback"></div>
    <div class="panel" role="dialog" aria-label="Feedback" id="feedback-dialog">
      <h2 id="feedback-form-title">Send feedback</h2>
      <div id="feedback-form">
        <textarea class="feedback-text" id="feedback-text" rows="4" maxlength="1000"></textarea>
        <p class="feedback-error" id="feedback-error" hidden></p>
        <div class="btn-row">
          <button class="btn secondary" id="feedback-cancel">Cancel</button>
          <button class="btn primary" id="feedback-send">Send</button>
        </div>
      </div>
      <p class="feedback-thanks" id="feedback-thanks" hidden>Thanks! 💜</p>
    </div>
  </div>

  <!-- In-app game player: keeps the installed PWA standalone (no address bar). -->
  <div class="player" id="player" hidden>
    <header class="player-bar">
      <button class="player-back" id="player-back" aria-label="Back to games">
        <span class="player-back-arrow" aria-hidden="true">‹</span>
        <span id="player-back-label">Games</span>
      </button>
      <span class="player-title" id="player-title"></span>
    </header>
    <iframe class="player-frame" id="player-frame" title="Game" allow="autoplay; fullscreen"></iframe>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
