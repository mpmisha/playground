<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#20264f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Playground">
  <title>Playground</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hub">
    <button class="hub-gear" id="hub-gear" aria-label="Settings">⚙︎</button>

    <ul class="game-grid" id="game-grid" aria-label="Games"></ul>

    <p class="hub-empty" id="hub-empty" hidden>No games yet.</p>
  </main>

  <!-- Global settings, inherited by every game (same-origin localStorage). -->
  <div class="overlay" id="settings-overlay" hidden>
    <div class="scrim" data-dismiss="settings"></div>
    <div class="panel" role="dialog" aria-label="Settings">
      <h2>Settings</h2>
      <p class="panel-sub">Applies to every game</p>

      <div class="row">
        <span class="row-label">Sound</span>
        <button class="toggle" id="toggle-sound" role="switch"><span class="knob"></span></button>
      </div>

      <div class="row">
        <span class="row-label">Vibration</span>
        <button class="toggle" id="toggle-haptics" role="switch"><span class="knob"></span></button>
      </div>

      <button class="btn secondary" id="btn-close">Close</button>
    </div>
  </div>

  <!-- In-app game player: keeps the installed PWA standalone (no address bar). -->
  <div class="player" id="player" hidden>
    <header class="player-bar">
      <button class="player-back" id="player-back" aria-label="Back to games">
        <span class="player-back-arrow" aria-hidden="true">‹</span>
        <span>Games</span>
      </button>
      <span class="player-title" id="player-title"></span>
    </header>
    <iframe class="player-frame" id="player-frame" title="Game" allow="autoplay; fullscreen"></iframe>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
