<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#20264f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flappy Bird">
  <meta name="description" content="A calm, kid-friendly flappy bird game. Tap to fly through the gaps! No ads, no accounts, no internet needed.">
  <title>Flappy Bird</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Hebrew-capable rounded font (Baloo 2 has no Hebrew glyphs). -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>

  <header id="hud">
    <div class="best-badge" id="best-badge">
      <span class="crown">👑</span>
      <span class="best-value" id="hud-best">0</span>
    </div>
    <div class="score" id="hud-score">0</div>
    <button class="gear" id="gear" data-i18n-aria="settings" aria-label="Settings">⚙︎</button>
  </header>

  <!-- Settings overlay -->
  <div class="overlay" id="settings-overlay" hidden>
    <div class="scrim" data-dismiss="settings"></div>
    <div class="panel" role="dialog" aria-label="Settings">
      <h2 data-i18n="settings">Settings</h2>
      <p class="panel-best" id="settings-best">Best score: 0</p>

      <div class="row">
        <span class="row-label" data-i18n="difficulty">Difficulty</span>
        <div class="segmented" id="difficulty-seg">
          <button data-difficulty="calm" data-i18n="calm">Calm</button>
          <button data-difficulty="easy" data-i18n="easy">Easy</button>
          <button data-difficulty="normal" data-i18n="normal">Normal</button>
        </div>
      </div>

      <div class="row">
        <span class="row-label" data-i18n="sound">Sound</span>
        <button class="toggle" id="toggle-sound" role="switch"><span class="knob"></span></button>
      </div>

      <div class="row">
        <span class="row-label" data-i18n="vibration">Vibration</span>
        <button class="toggle" id="toggle-haptics" role="switch"><span class="knob"></span></button>
      </div>

      <button class="btn primary" id="btn-new-game" data-i18n="newGame">New Game</button>
      <button class="btn danger" id="btn-reset-best" data-i18n="resetBest">Reset Best Score</button>
      <a class="btn secondary" id="btn-back-hub" hidden><span class="back-arrow" aria-hidden="true">←</span> <span class="back-label" data-i18n="backToGames">Back to Games</span></a>
      <button class="btn secondary" id="btn-close" data-i18n="close">Close</button>
    </div>
  </div>

  <!-- Game over overlay — soft and friendly, never a harsh "Game Over" -->
  <div class="overlay" id="gameover-overlay" hidden>
    <div class="scrim"></div>
    <div class="panel gameover" role="dialog" aria-label="Round over">
      <div class="go-emoji" id="go-emoji">🐣</div>
      <h2 id="go-title">Oops!</h2>
      <p class="go-caption" id="go-caption" data-i18n="yourScore">Your score</p>
      <div class="go-score" id="go-score">0</div>
      <p class="go-best" id="go-best">👑 Best: 0</p>
      <button class="btn primary" id="btn-play-again" data-i18n="playAgain">Play Again</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
